<!doctype html>
<html lang="{{ settings.ui_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Commonword{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <nav class="topnav" aria-label="Primary">
      <a href="/discover">{{ tr('nav_discover') }}</a>
      <a href="/discover?favourites=1">{{ tr('nav_favourites') }}</a>
      <a href="/study">{{ tr('nav_study') }}</a>
      <a href="/settings">{{ tr('nav_settings') }}</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>{{ tr('brand_sub') }}</span>
    <span>{% block footer_note %}Local profile · Preferences persist on this device{% endblock %}</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
